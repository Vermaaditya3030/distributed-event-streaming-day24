global:
  scrape_interval: 10s
scrape_configs:
- job_name: event-api
  metrics_path: /actuator/prometheus
  static_configs: [{targets: ['event-api:8080']}]
- job_name: producer
  metrics_path: /actuator/prometheus
  static_configs: [{targets: ['producer:8081']}]
- job_name: consumer
  metrics_path: /actuator/prometheus
  static_configs: [{targets: ['consumer:8082']}]
